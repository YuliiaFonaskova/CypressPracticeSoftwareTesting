name: Cypress Tests

on:
  push:
    branches:
      - main
      - master
      - refactor/page-objects
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Practice Software Testing stack
        run: |
          docker compose -f docker-compose.ci.yml up -d --wait --pull missing || {
            docker compose -f docker-compose.ci.yml logs
            exit 1
          }
          docker compose -f docker-compose.ci.yml exec -T api php artisan migrate:fresh --seed --force
          docker compose -f docker-compose.ci.yml exec -T api php artisan optimize:clear

      - name: Run Cypress tests
        run: npm run cy:chrome
        env:
          BASE_URL: http://localhost:4200
          USER_EMAIL: customer@practicesoftwaretesting.com
          USER_PASSWORD: welcome01

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
